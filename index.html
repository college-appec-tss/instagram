<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhotoShare is a photo-sharing demo where you can explore photos and connect with friends.">
  <title>PhotoShare - Share Your Moments</title>
  <link rel="stylesheet" href="style.css">
  <!-- Optional script font for a classic social logo feel -->
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
  <main class="page">
    <!-- Left side: Photo showcase -->
    <section class="showcase">
      <div class="photo-collage">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Portrait photography" class="photo photo1">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Beautiful landscape" class="photo photo2">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Travel photography" class="photo photo3">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500" alt="Beautiful flowers" class="photo photo4">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" alt="Portrait of a woman" class="photo photo5">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500" alt="Nature photography" class="photo photo6">
      </div>
      <div class="showcase-text">
        <h2>Discover beautiful moments.</h2>
        <p>Explore photography, share your experiences and connect with people.</p>
      </div>
    </section>

    <!-- Right side: Login -->
    <section class="login-section">
      <div class="login-card">
        <h1 class="brand-logo">PhotoShare</h1>
        <p class="subtitle">Log in to continue sharing your moments.</p>
        
        <form id="login-form">
          <div class="input-group">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
          </div>
          <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
          </div>
          <button type="submit" id="buto">Log in</button>
        </form>

        <p id="message"></p>

        <div class="separator">
          <span>OR</span>
        </div>

        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <div class="signup-card">
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </div>

      <div class="download">
        <p>Experience PhotoShare on every device.</p>
      </div>
    </section>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="#">About</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Help</a>
    </nav>
    <p class="copyright">© 2026 PhotoShare</p>
  </footer>
</body>
</html>
