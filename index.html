
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhotoShare educational photo-sharing website demo.">
  <title>PhotoShare - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-container">
    <section class="login-card">
      <h1 class="logo">PhotoShare</h1>
      <p>Share your moments with friends.</p>

      <form id="loginForm">
        <input id="username" placeholder="Demo username" required>
        <input id="password" type="password"
               placeholder="Demo password" required>
        <button type="submit">Log in</button>
      </form>

      <p id="message"></p>
      <p class="demo-info">
        Demo username: demo<br>
        Demo password: photoshare
      </p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
